<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
         var ans = Math.random();
        document.write("<h1>", ans, "</h1>");

        var ans1 = Math.floor(Math.random()*10);
        document.write("<h1>", ans1, "</h1>");

        var ans2 = Math.floor(Math.random()*11);
        document.write("<h1>", ans2, "</h1>");

        var ans3 = Math.floor(Math.random()*100);
        document.write("<h1>", ans3, "</h1>");

        var ans4 = Math.floor(Math.random()*101);
        document.write("<h1>", ans4, "</h1>");

         var ans5 = Math.floor(Math.random()*10)+1;
        document.write("<h1>", ans5, "</h1>");

         var ans6 = Math.floor(Math.random()*100)+1;
        document.write("<h1>", ans6, "</h1>");
    </script>
</body>
</html>
