<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a = Number(prompt("Enter any number : "));

        var i = 1;
        while(i <= 10){
            ans = a * i;
            document.write("<h3> ", a, " * ", i, " = ", ans, "</h3>");
            i++;
        }
    </script>
</body>
