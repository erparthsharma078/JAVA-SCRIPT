<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home 1 Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
            padding: 32px;
        }
        .butn {
            background-color: blue;
            color: aliceblue;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 10px;
        }
        .butn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <h1>This is Home 1 Page</h1>
    <p>Opened via <code>window.open('home1.html')</code>.</p>
    <button onclick="location.href='index.html'" class="butn">Go to Index Page</button>
    <button onclick="history.back()" class="butn">Back</button>
    <button onclick="history.forward()" class="butn">Forward</button>
    <button onclick="history.go(0)" class="butn">Reload (go 0)</button>
</body>
</html>
