<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script>
    function dataSet(){
      // window.localStorage.setItem("name", "anuj");
      localStorage.setItem("name", "sanju");
    }

    function dataGet(){
      var mynm=localStorage.getItem("name");
      document.getElementById("demo").innerHTML=mynm;
    }
  </script>
</head>
<body>
  <button onclick="dataSet()">Set Data</button>
  <button onclick="dataGet()">Get Data</button>
  <h1 id="demo">welcome....</h1>
</body>
</html>
