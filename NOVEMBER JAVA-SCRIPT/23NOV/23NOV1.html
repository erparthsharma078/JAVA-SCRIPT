<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script>
    var Table = `<table border="1" align="center" width="80%" bgcolor="pink">
      <tr bgcolor="orange">
        <th>User ID </th>
        <th>ID </th>
        <th>Title </th>
        <th> Body </th>
      </tr>
    `;

    async function display(){
      const Obj = await fetch("https://jsonplaceholder.typicode.com/posts");
      const Data = await Obj.json();
      console.log(Data);

      Data.map((val)=>{
        Table += `<tr>
          <td> ${val.userId} </td>
          <td> ${val.id} </td>
          <td> ${val.title} </td>
          <td> ${val.body} </td>
        </tr>
        `;
      })
      Table += "</table>";
      document.getElementById("demo").innerHTML = Table;
    }
  </script>
</head>
<body>
  <button onclick="display()">Click here!!!</button>
  <hr size="4" color="red">
  <p id="demo">welcome....</p>
</body>
</html>
