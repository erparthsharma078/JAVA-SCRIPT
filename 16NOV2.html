<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<script>
    function mydata(){
        document.getElementById("demo").innerHTML += "Happy Birthday!!!";
    }

    function display(){
        setInterval(mydata, 1000);
    }
</script>
</head>
<body>
<button onclick="display()">Click here!</button>
<p id="demo">Welcome!!!...</p>
</body>
</html>
