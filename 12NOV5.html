<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
</head>
<body>
<script>
    let d = new Date();
    let ans = d.getMonth();

    const month = ["January", "February", "March", "April", "May", "Jun", "July", "August", "September", "October", "November", "December"];

    document.write("<h2>", d, "</h2>");
    document.write("<h1>", ans, "</h1>");
    document.write("<h1>", month[ans], "</h1>");
</script>
</body>
</html>
