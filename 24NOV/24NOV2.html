<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script>
    function display() {
      let Obj = document.querySelectorAll("p");
      console.log(Obj);
      for (var i = 0; i < Obj.length; i++) {
        Obj[i].style.color = "red";
        Obj[i].style.fontWeight = "bold";
      }
    }
  </script>
</head>
<body>
  <button onclick="display()">click here!</button>
  <p>welcome To Bhopal</p>
  <p>we learn js </p>
  <p>Hello friends we are from bhopal </p>
  <p>welcome to india we are indians</p>
</body>
