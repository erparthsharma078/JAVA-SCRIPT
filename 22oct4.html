<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a = 10;
        console.log(a);
        console.log(typeof(a));

        var b = "45";
        console.log(b);
        console.log(typeof(b));

        var subject = [3, 4, 5, 6, 7];
        console.log(subject);
        console.log(typeof(subject));

        var myval = true;
        console.log(myval);
        console.log(typeof(myval));

        var student = {"rollno": 121, "name": "raju", "fees": 45000};
        console.log(student);
        console.log(typeof(student));

        var myfun = function() {};
        console.log(myfun);
        console.log(typeof(myfun));

        var x = 34.566;
        console.log(x);
        console.log(typeof(x));
    </script>
</body>
</html>
